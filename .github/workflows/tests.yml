name: Tests

# Every push to master and every pull request (including the operator's own
# operator/... PRs, whose result gates the merge). Stdlib-only tests.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: python -I -B scripts/run_tests.py
