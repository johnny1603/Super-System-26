name: Tests

# Every push to master and every pull request (including the operator's own
# operator/... PRs, whose result gates the merge). Stdlib-only tests.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow (the pinned version) + FriBidi, so the image tests RUN here
      # instead of skipping: core/avatar_photos and the Hebrew slide renderer.
      # fonttools + brotli (pinned): the client font upload tests (core/brand_fonts).
      - name: Image and font libraries for the Pillow and font tests
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfribidi0
          pip install "$(grep -i '^pillow==' requirements.txt)" "$(grep -i '^fonttools==' requirements.txt)" "$(grep -i '^brotli==' requirements.txt)"
      - name: Run the test suite
        run: python -I -B scripts/run_tests.py
