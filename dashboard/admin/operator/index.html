<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>uallak — איציק</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
/* איציק's workspace (core/operator_agent, docs/OPERATOR.md): production now +
   one-tap rollback, approvals waiting for the owner, saved reports, the
   action log, flags. The conversation itself is the floating chat
   (/assets/itzik-chat.js), the same one every admin page carries. Admin
   session only — every /api/admin/operator/* route answers 401 without it. */
:root {
  --bg: #0D0D0D; --panel: #171717; --panel-2: #1F1F1F; --accent: #FF4C1F;
  --accent-dim: rgba(255,76,31,0.12); --white: #F7F4EF; --gray: #8A8A85;
  --border: rgba(255,255,255,0.08); --green: #00C96E; --yellow: #FFB020; --red: #FF3B3B;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow-x: hidden; }
body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--white); min-height:100vh; font-size:15px; }
.wrap { max-width:1080px; margin:0 auto; padding:0 16px 200px; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px;
  border-bottom:1px solid var(--border); background:linear-gradient(180deg,#141414,#0D0D0D); position:sticky; top:0; z-index:5; }
.logo { display:flex; align-items:center; gap:10px; font-size:19px; font-weight:900; letter-spacing:-1px; min-width:0; }
.logo span { color:var(--accent); }
.logo img { width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.topbar a, .topbar button { color:var(--gray); font:inherit; font-size:13px; text-decoration:none; border:1px solid var(--border);
  padding:6px 12px; border-radius:100px; background:none; cursor:pointer; white-space:nowrap; }
.topbar .actions { display:flex; gap:8px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
.grid > .wide { grid-column:1 / -1; }
@media (max-width:820px) { .grid { grid-template-columns:1fr; } }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-top:14px; min-width:0; }
.grid .card { margin-top:0; }
.card h2 { font-size:15px; font-weight:700; margin-bottom:8px; }
.muted { color:var(--gray); font-size:13px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
.btn { font-family:inherit; font-size:14px; font-weight:700; border-radius:10px; padding:11px 16px; border:0; cursor:pointer;
  background:var(--panel-2); color:var(--white); border:1px solid var(--border); min-height:44px; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.danger { background:var(--red); border-color:var(--red); color:#fff; }
.btn:disabled { opacity:.45; cursor:default; }
.badge { display:inline-block; font-size:12px; padding:2px 9px; border-radius:100px; background:var(--panel-2); border:1px solid var(--border); }
.badge.ok { color:var(--green); } .badge.warn { color:var(--yellow); } .badge.bad { color:var(--red); }
.banner { background:rgba(255,59,59,.12); border:1px solid var(--red); border-radius:14px; padding:14px; margin-top:14px; }
.sub { margin-top:10px; padding:10px; border-radius:10px; background:var(--panel-2); border:1px solid var(--border); white-space:normal; }
.report { margin-top:10px; padding:12px; border-radius:10px; background:var(--panel-2); border:1px solid rgba(0,201,110,.35);
  white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; font-size:14px; }
.report summary { cursor:pointer; font-weight:700; white-space:normal; }
details summary { cursor:pointer; color:var(--gray); font-size:13px; margin-top:8px; }
.result { font-size:13px; margin-top:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
.small-pre { direction:ltr; text-align:left; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; }
/* The approval cards come from the chat component; give them this page's spacing */
#pending .itz-card, #changes .itz-card { background:var(--panel-2); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><img src="/assets/agents/itzik-portrait.webp" alt="" onerror="this.onerror=null;this.src='/assets/agents/itzik-portrait.png'">
    <div>u<span>allak</span> · איציק</div></div>
  <div class="actions"><button type="button" id="openChat">💬 לדבר עם איציק</button><a href="/admin/">← לניהול</a></div>
</div>
<div class="wrap">
  <div id="authNote" class="card" style="display:none;">לא מחובר לניהול. <a href="/admin/" style="color:var(--accent)">להתחברות</a></div>
  <div id="banner"></div>
  <div class="grid" style="margin-top:14px;">
    <div class="card" id="statusCard"><h2>הייצור עכשיו</h2><div class="muted">טוען…</div></div>
    <div class="card" id="pending"><h2>מחכה לאישור שלך</h2><div class="muted">טוען…</div></div>
    <div class="card wide" id="reports"><h2>דוחות שמורים</h2><div class="muted">טוען…</div></div>
    <div class="card" id="auditCard"><h2>יומן פעולות</h2><div id="audit" class="muted">טוען…</div></div>
    <div class="card"><details id="moreBox"><summary>שינויי קוד אחרונים, מתגים והתראות שנכשלו</summary>
      <div id="changes"></div><div id="flags"></div><div id="failed"></div></details></div>
  </div>
</div>
<script src="/assets/itzik-chat.js"></script>
<script>
const IC = window.ItzikChat;
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function when(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; } }
async function call(path, opts) {
  try { return await IC.call(path, opts); }
  catch (e) { if (e.auth) $('authNote').style.display = 'block'; throw e; }
}

// ─── Status + one-tap rollback ───────────────────────────────────────────────
// Tier 1, read-only: nothing is created on GitHub
async function githubCheck(btn, out) {
  btn.disabled = true; out.textContent = 'בודק את GitHub…';
  try {
    const r = await call('/github-check');
    out.textContent = r.summary_he + '\n' + (r.lines || []).map(l =>
      (l.ok === true ? '✓ ' : l.ok === false ? (l.recommended ? '• ' : '✗ ') : '? ') + l.text_he).join('\n');
  } catch (e) { out.textContent = IC.errText(e); }
  btn.disabled = false;
}
async function loadStatus() {
  const card = $('statusCard'), banner = $('banner');
  let d; try { d = await call('/status'); } catch (e) { card.lastChild.textContent = IC.errText(e); return; }
  card.textContent = ''; card.appendChild(el('h2', null, 'הייצור עכשיו'));
  banner.textContent = '';
  const c = d.cloud || {};
  if (c.error) {
    card.appendChild(el('div', 'muted', 'אין גישה ל-Cloud Run מהשרת (' + c.error + '). מה שצריך: bash scripts/setup_operator.sh ב-Cloud Shell.'));
  } else {
    const s = c.serving || {};
    const line = el('div');
    line.appendChild(el('span', 'badge ' + (s.pinned ? 'warn' : 'ok'), s.pinned ? 'נעוץ לגרסה (אחרי חזרה אחורה)' : 'גרסה אחרונה'));
    line.appendChild(document.createTextNode(' ' + (s.revision || '?')));
    card.appendChild(line);
    card.appendChild(el('div', 'muted', 'עלתה: ' + when(c.serving_since) + ' · קומיט: ' + (c.running_commit ? c.running_commit.slice(0, 7) : 'לא ידוע (פריסה ידנית)')));
    const w = c.watch || {};
    if (w.recent_deploy) card.appendChild(el('div', 'muted', 'פריסה טרייה — שגיאות מאז: ' + (w.errors == null ? '?' : w.errors)));
    const row = el('div', 'row'), out = el('div', 'result');
    const prev = (c.previous || {}).name;
    if (prev) {
      const b = el('button', 'btn' + (w.suspicious ? ' danger' : ''), '↩ חזרה לגרסה הקודמת (' + prev + ')');
      b.onclick = () => IC.runAction('rollback', { revision: prev }, b, out); row.appendChild(b);
    }
    if (s.pinned) { const b = el('button', 'btn primary', '→ חזרה לגרסה האחרונה'); b.onclick = () => IC.runAction('restore_latest', {}, b, out); row.appendChild(b); }
    card.appendChild(row); card.appendChild(out);
    if (w.suspicious && prev) {
      const bn = el('div', 'banner');
      bn.appendChild(el('div', null, '⚠ הגרסה שעלתה ב-' + when(w.deployed_at) + ' מייצרת שגיאות (' + w.errors + '). חזרה לגרסה הקודמת היא לחיצה אחת והפיכה.'));
      const r2 = el('div', 'row'), o2 = el('div', 'result'), b2 = el('button', 'btn danger', '↩ חזור עכשיו ל-' + prev);
      b2.onclick = () => IC.runAction('rollback', { revision: prev }, b2, o2); r2.appendChild(b2); bn.appendChild(r2); bn.appendChild(o2);
      banner.appendChild(bn);
    }
  }
  const t3 = d.tier3 || {};
  card.appendChild(el('div', 'muted', t3.ok
    ? 'שינויי קוד: פעילים · קודי אישור נשלחים ל-' + t3.sent_to
    : 'שינויי קוד: כבויים — חסר: ' + (t3.missing || []).join(', ') + (d.github_configured ? '' : ', OPERATOR_GITHUB_TOKEN')));
  const ghRow = el('div', 'row'), ghOut = el('div', 'result'), gh = el('button', 'btn', 'בדיקת חיבור GitHub');
  gh.onclick = () => githubCheck(gh, ghOut);
  ghRow.appendChild(gh); card.appendChild(ghRow); card.appendChild(ghOut);
  renderPending(d.changes || []); renderChanges(d.changes || []); renderFlags(d.flags || []);
}

// ─── Approvals waiting for the owner (Tier 3: each step = a new emailed code) ─
function renderPending(list) {
  const box = $('pending'); box.textContent = '';
  box.appendChild(el('h2', null, 'מחכה לאישור שלך'));
  const waiting = list.filter(ch => ch.status === 'proposed' || ch.status === 'pr_open');
  if (!waiting.length) box.appendChild(el('div', 'muted', 'אין כרגע. כשאיציק מציע תיקון, האישור מופיע כאן ובצ׳אט.'));
  waiting.forEach(ch => box.appendChild(IC.renderChange(ch)));
}
function renderChanges(list) {
  const box = $('changes'); box.textContent = '';
  box.appendChild(el('h2', null, 'שינויי קוד אחרונים')).style.marginTop = '12px';
  if (!list.length) box.appendChild(el('div', 'muted', 'אין.'));
  list.forEach(ch => box.appendChild(IC.renderChange(ch)));
}
function renderFlags(flags) {
  const box = $('flags'); box.textContent = '';
  box.appendChild(el('h2', null, 'מתגים')).style.marginTop = '16px';
  flags.forEach(f => {
    const s = el('div', 'sub');
    s.appendChild(el('div', null, f.label_he + ' — ' + (f.effective ? 'פעיל' : 'כבוי') + (f.override === null ? ' (ברירת מחדל)' : ' (עקיפה)')));
    s.appendChild(el('div', 'muted', f.name + ' · ' + f.note_he));
    const row = el('div', 'row'), out = el('div', 'result');
    [['on', 'הדלק'], ['off', 'כבה'], ['default', 'ברירת מחדל']].forEach(([st, label]) => {
      const b = el('button', 'btn', label); if (st === 'on' && !f.can_turn_on) b.disabled = true;
      b.onclick = () => IC.runAction('flip_flag', { flag: f.name, state: st }, b, out); row.appendChild(b);
    });
    s.appendChild(row); s.appendChild(out); box.appendChild(s);
  });
}

// ─── Saved reports ───────────────────────────────────────────────────────────
async function loadReports() {
  const box = $('reports');
  let rows; try { rows = await call('/messages'); } catch (e) { box.lastChild.textContent = IC.errText(e); return; }
  box.textContent = ''; box.appendChild(el('h2', null, 'דוחות שמורים'));
  const reports = rows.filter(m => m.kind === 'report').reverse();
  if (!reports.length) box.appendChild(el('div', 'muted', 'עוד אין. כל בדיקה של איציק נגמרת בדוח, והוא נשמר כאן.'));
  reports.forEach((m, i) => {
    const d = el('details', 'report'); if (i === 0) d.open = true;
    const lines = String(m.content || '').split('\n');
    d.appendChild(el('summary', null, (lines[0] || 'דוח') + ' · ' + when(m.created_at)));
    d.appendChild(document.createTextNode(lines.slice(1).join('\n')));
    box.appendChild(d);
  });
}

// ─── Action log + failed notifications ───────────────────────────────────────
async function loadAudit() {
  let d; try { d = await call('/audit'); } catch (e) { $('audit').textContent = IC.errText(e); return; }
  const box = $('audit'); box.className = 'small-pre';
  box.textContent = (d.audit || []).map(a => a.entry).join('\n') || 'ריק.';
  const failed = $('failed'); failed.textContent = '';
  if ((d.failed_notifications || []).length) {
    failed.appendChild(el('h2', null, 'התראות WhatsApp שנכשלו')).style.marginTop = '16px';
    d.failed_notifications.forEach(n => {
      const s = el('div', 'sub'); s.appendChild(el('div', null, 'לקוח ' + n.client_id + ' · ' + when(n.at)));
      s.appendChild(el('div', 'muted', n.preview));
      const row = el('div', 'row'), out = el('div', 'result'), b = el('button', 'btn', 'שלח שוב');
      if (!n.resendable) { b.disabled = true; out.textContent = 'נשמרה מקוצרת — לא ניתן לשלוח שוב'; }
      b.onclick = () => IC.runAction('resend_notification', { activity_id: n.id }, b, out);
      row.appendChild(b); s.appendChild(row); s.appendChild(out); failed.appendChild(s);
    });
  }
}

function loadAll() { loadStatus(); loadReports(); loadAudit(); }
$('openChat').onclick = async () => { if (await IC.mount()) IC.open(); };
// Anything done from the chat or a card refreshes this page
window.addEventListener('itzik:changed', loadAll);
loadAll();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
